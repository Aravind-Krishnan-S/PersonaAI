name: persona_ai_android
description: "PersonaAI — Chat with fictional characters from your books."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Database
  sqflite: ^2.4.2
  path: ^1.9.1

  # Networking
  dio: ^5.7.0

  # Device info & file access
  device_info_plus: ^11.3.3
  path_provider: ^2.1.5
  file_picker: ^8.1.7

  # Typography
  google_fonts: ^6.2.1

  # Animations
  flutter_animate: ^4.5.2
  shimmer: ^3.0.0

  # Icons
  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
